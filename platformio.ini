; Time sync via sensing - ESP32 sensing node
; Build/flash one node:   pio run -e nodeA -t upload
; Serial monitor:          pio device monitor -e nodeA


[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags = -Wall

[env:nodeA]
build_flags = ${env.build_flags} -D NODE_ID=1

[env:nodeB]
build_flags = ${env.build_flags} -D NODE_ID=2

